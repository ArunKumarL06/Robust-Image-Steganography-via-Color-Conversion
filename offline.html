<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline - Steganography Explorer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      body {
        background-color: #111827; /* bg-gray-900 */
        color: #d1d5db; /* text-gray-300 */
        font-family: sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        text-align: center;
      }
      .container {
        padding: 2rem;
        background-color: #1f2937; /* bg-gray-800 */
        border-radius: 0.5rem;
        border: 1px solid #374151; /* border-gray-700 */
      }
      h1 {
        font-size: 2.25rem;
        font-weight: bold;
        color: #f9fafb; /* text-gray-50 */
      }
      p {
        margin-top: 1rem;
        color: #9ca3af; /* text-gray-400 */
      }
    </style>
</head>
<body>
    <div class="container">
        <h1>You are Offline</h1>
        <p>This page can't be displayed because you're not connected to the internet.</p>
        <p>Please check your connection and try again. Previously visited pages might be available.</p>
    </div>
</body>
</html>
